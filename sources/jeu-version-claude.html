<title>Duel des Invocateurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout : écran portrait unique (max 480px). Accueil / Deck avec barre du bas ; combat = arène canvas + main de 4 cartes. Univers sombre unique, assumé. */
:root{
  --table:#120e1c; --table-2:#1d1630; --felt:#271d40; --line:#3a2f57;
  --gold:#e8b94a; --gold-dim:#a9812c; --ink:#efe8f7; --muted:#a79cbf;
  --blue:#3d8bfd; --red:#e5484d; --ok:#46c27a; --elixir:#d24bd8;
  --rC:#8c87a0; --rR:#3d8bfd; --rE:#b05cf0; --rL:#f5a623;
  --display:"Grenze Gotisch",Georgia,serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
@supports(height:100dvh){html,body{height:100dvh}}
[hidden]{display:none!important}
.hand>*,.deck>*,.reveal>*,.cell{min-width:0}
.card .art{position:relative}
.card .art img{position:absolute;inset:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--felt),var(--table) 70%);background-color:var(--table);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
body.battle #app{padding-inline:6px}
.fsbtn{background:var(--table-2);color:var(--ink);border:1px solid var(--line);padding:4px 8px;font-size:15px;border-radius:99px;line-height:1}
.install{margin-top:14px;background:var(--table-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.45}
.install b{color:var(--ink)}
button{font-family:var(--body);font-weight:700;font-size:15px;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;color:var(--table);background:var(--gold)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-block:12px;gap:8px}
.logo{font-family:var(--display);font-size:20px;color:var(--gold);line-height:1}
.purse{display:flex;gap:6px;font-variant-numeric:tabular-nums;font-weight:700}
.pill{background:var(--table-2);border:1px solid var(--line);border-radius:99px;padding:3px 8px;white-space:nowrap;font-size:13px}
.lvl{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);width:100%}
.lvl b{background:var(--gold);color:var(--table);border-radius:6px;padding:0 6px;font-size:12px;white-space:nowrap}
.lvl .prog{flex:1;height:6px}
.mapbtn{width:100%;margin-top:10px;display:flex;align-items:center;gap:12px;background:var(--table-2);color:var(--ink);border:1px solid var(--line);text-align:left;padding:8px}
.mapbtn img,.mapcard img{width:64px;height:64px;object-fit:cover;object-position:50% 40%;border-radius:8px;flex:none}
.mapbtn span{flex:1;min-width:0}
.mapbtn small{display:block;color:var(--muted);font-weight:600}
.maps{display:grid;gap:10px;text-align:left}
.mapcard{display:flex;gap:12px;align-items:center;background:var(--table);border:1px solid var(--line);border-radius:12px;padding:8px}
.mapcard.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.mapcard.lock img{filter:grayscale(1) brightness(.45)}
.mapcard .t{flex:1;min-width:0}
.mapcard .t b{display:block}
.mapcard button{padding:8px 10px;font-size:13px;white-space:nowrap}
.shop h4:first-child{margin-top:8px}
.offers{display:grid;gap:10px}
.offer{display:flex;gap:12px;align-items:center;background:var(--table-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.offer .ic{width:56px;height:56px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:28px;background:linear-gradient(160deg,#5b3fa0,#2a1d4d);border:2px solid var(--gold-dim);overflow:hidden}
.offer .ic img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.offer .tx{flex:1;min-width:0}
.offer .tx b{display:block}
.offer .tx span{font-size:12px;color:var(--muted)}
.offer button{padding:9px 10px;font-size:13px;white-space:nowrap}
.offer.iap{border-style:dashed}
.gem{color:#e3c8ff}
#tut{position:fixed;inset:0;z-index:66;cursor:pointer}
.tut-dim{position:absolute;inset:0;background:#000b}
.tut-hole{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px #000b,0 0 0 3px var(--gold),0 0 22px var(--gold);animation:tutp 1.2s ease-in-out infinite}
@keyframes tutp{50%{box-shadow:0 0 0 9999px #000b,0 0 0 5px var(--gold),0 0 30px var(--gold)}}
.tut-b{position:absolute;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--table-2);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;color:var(--ink)}
.tut-b b{font-family:var(--display);font-size:22px;color:var(--gold)}
.tut-b p{margin:4px 0 6px;line-height:1.4}
.tut-b span{font-size:11px;color:var(--muted)}
/* ---- écran de chargement ---- */
#boot{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(48px + env(safe-area-inset-bottom,0px));background:#120e1c;overflow:hidden;transition:opacity .5s}
#boot.out{opacity:0;pointer-events:none}
#boot .bg{position:absolute;inset:-20px;background:url(art/arena.webp) center 60%/cover;filter:blur(3px) brightness(.45);transform:scale(1.08);animation:bootzoom 12s ease-in-out infinite alternate}
@keyframes bootzoom{to{transform:scale(1.18)}}
#boot .logo-b{position:absolute;top:22%;left:0;right:0;text-align:center}
#boot .logo-b img{width:120px;height:120px;filter:drop-shadow(0 0 24px #b06cffaa);animation:coinspin 3.2s ease-in-out infinite}
@keyframes coinspin{50%{transform:translateY(-8px) rotateY(25deg)}}
#boot h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:.95;margin:10px 0 0;color:#ffe9a8;text-shadow:0 3px 0 #6b4a10,0 0 26px #e8b94a88;letter-spacing:.5px}
#boot .sub{color:#d9c8ff;font-weight:700;letter-spacing:.2em;font-size:12px;text-transform:uppercase;margin-top:8px}
#boot .tip{position:relative;color:#e8def8;font-size:14px;text-align:center;min-height:2.6em;margin-bottom:14px;max-width:340px}
#boot .pbar{position:relative;width:100%;max-width:340px;height:16px;border-radius:9px;background:#0009;border:2px solid #000;box-shadow:0 0 0 2px #e8b94a55;overflow:hidden}
#boot .pbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(180deg,#ffe28a,#e8a32a);transition:width .25s}
#boot .tap{position:relative;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 0 #000;margin-top:18px;animation:tapb 1.2s ease-in-out infinite;visibility:hidden}
#boot.ready .tap{visibility:visible}
@keyframes tapb{50%{opacity:.35;transform:scale(.96)}}
/* ---- citadelle (accueil) ---- */
body.home #top,body.home #nav{display:none}
.vil{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:#120e1c;z-index:2;user-select:none}
.vil-bg{position:absolute;max-width:none}
.bld{position:absolute;transform:translate(-50%,-80%);cursor:pointer;transition:transform .12s;-webkit-tap-highlight-color:transparent}
.bld:active{transform:translate(-50%,-80%) scale(.95)}
.bld img{display:block;width:100%;filter:drop-shadow(0 6px 6px #0008)}
.bld .tag{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:11px;color:#fff;background:#000a;border:1px solid #fff3;border-radius:6px;padding:1px 6px;text-shadow:0 1px 0 #000}
.bubble{position:absolute;left:50%;top:6%;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;background:radial-gradient(circle at 50% 30%,#fff,#e8e2f5);color:#3a2a10;font-weight:900;font-size:13px;border-radius:99px;padding:4px 9px 4px 4px;box-shadow:0 3px 0 #0006,0 0 0 2px #e8b94a;animation:bob 1.4s ease-in-out infinite;z-index:3}
.bubble img{width:22px;height:22px}
.bubble.full{box-shadow:0 3px 0 #0006,0 0 0 3px #46c27a,0 0 16px #46c27a}
@keyframes bob{50%{transform:translate(-50%,-112%)}}
.hud-tl{position:absolute;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));left:8px;display:flex;gap:8px;align-items:center;max-width:56%}
.lvb{position:relative;flex:none;width:48px;height:48px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #123;background:radial-gradient(circle at 40% 30%,#7cc0ff,#1d5fd0 70%);clip-path:polygon(50% 0,61% 33%,98% 35%,68% 57%,79% 92%,50% 72%,21% 92%,32% 57%,2% 35%,39% 33%);filter:drop-shadow(0 2px 0 #000)}
.pl{min-width:0}
.pl b{display:block;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 0 #000,0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpb{height:9px;width:110px;max-width:100%;background:#000a;border:1.5px solid #000;border-radius:5px;overflow:hidden;margin:2px 0}
.xpb i{display:block;height:100%;background:linear-gradient(#a8e3ff,#3d9dff)}
.trp{display:inline-flex;align-items:center;gap:3px;color:#ffe28a;font-weight:900;font-size:13px;text-shadow:0 2px 0 #000}
.hud-tr{position:absolute;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.rbar{position:relative;display:flex;align-items:center;width:128px;height:26px;background:#000b;border:2px solid #000;border-radius:7px;box-shadow:inset 0 0 0 1px #fff2}
.rbar i{position:absolute;inset:2px auto 2px 2px;border-radius:4px;opacity:.85}
.rbar.gold i{background:linear-gradient(#ffe28a,#d79a1c)}
.rbar.inv i{background:linear-gradient(#e2b8ff,#8a3fd8)}
.rbar .v{position:relative;flex:1;text-align:right;padding-right:30px;color:#fff;font-weight:900;font-size:14px;text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
.rbar .ico{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;font-size:24px;filter:drop-shadow(0 2px 0 #000)}
.rbar .ico img{width:34px;height:34px}
.rbar .plus{position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:22px;height:22px;padding:0;border-radius:6px;background:linear-gradient(#8fe36a,#3a9a2a);color:#fff;font-size:18px;line-height:20px;font-weight:900;border:2px solid #000;text-shadow:0 1px 0 #000}
.rcap{font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 0 #000;margin-top:-4px}
.side{position:absolute;z-index:5;display:flex;flex-direction:column;gap:12px}
.side.l{left:8px;top:calc(96px + env(safe-area-inset-top,0px))}.side.r{right:8px;top:calc(96px + env(safe-area-inset-top,0px))}
.rb{position:relative;width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:0;color:#fff;font-size:10px;font-weight:800;text-shadow:0 1px 0 #000,0 0 3px #000}
.rb .c{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(#4b3c7a,#251a45);border:2px solid #000;box-shadow:inset 0 2px 0 #ffffff33,0 3px 0 #000a}
.rb .c img{width:34px;height:34px;object-fit:cover;border-radius:50%}
.rb .dot{position:absolute;top:-4px;right:0;width:16px;height:16px;border-radius:50%;background:#e5484d;border:2px solid #000;color:#fff;font-size:10px;line-height:12px}
.bigb{position:absolute;z-index:5;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:0;background:none;padding:0;color:#fff;font-family:var(--display);font-weight:800;font-size:19px;text-shadow:0 2px 0 #000,0 0 4px #000}
.bigb .c{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:44px;border:3px solid #000;box-shadow:inset 0 4px 0 #ffffff55,inset 0 -6px 0 #0004,0 5px 0 #000a}
.bigb.atk{left:12px}.bigb.atk .c{background:radial-gradient(circle at 50% 35%,#ffcf5a,#e07b14 70%)}
.bigb.shp{right:12px}.bigb.shp .c{background:radial-gradient(circle at 50% 35%,#c99bff,#6b2fc0 70%)}
.bigb .c img{width:58px;height:58px}
.bigb small{font-family:var(--body);font-size:11px;font-weight:800;margin-top:-2px}
.bigb:active .c{transform:translateY(3px);box-shadow:inset 0 4px 0 #ffffff55,inset 0 -6px 0 #0004,0 2px 0 #000a}
.flycoin{position:fixed;z-index:70;width:26px;height:26px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.7,1),opacity .7s}
/* ---- recherche d'adversaire + VS ---- */
#mm{position:fixed;inset:0;z-index:55;overflow:hidden;background:linear-gradient(#5b8fd6,#c9dcf5);display:flex;align-items:center;justify-content:center;flex-direction:column}
#mm .cl{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 40%,#ffffff00 70%);animation:cloud 1.6s linear infinite}
@keyframes cloud{from{transform:translateX(120vw)}to{transform:translateX(-140vw)}}
#mm .msg{position:relative;font-family:var(--display);font-size:30px;color:#fff;text-shadow:0 3px 0 #23407a;text-align:center}
#mm .msg small{display:block;font-family:var(--body);font-size:14px;font-weight:700;color:#23407a;text-shadow:none;margin-top:6px}
#mm.vs{background:radial-gradient(circle at 50% 50%,#3b2d5e,#0b0814 75%)}
.vsrow{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:100%;max-width:440px;padding:0 12px;box-sizing:border-box}
.vsp{text-align:center;min-width:0;animation:vsin .45s cubic-bezier(.2,1.4,.4,1) both}
.vsp.r{animation-name:vsinr}
@keyframes vsin{from{transform:translateX(-120%)}}@keyframes vsinr{from{transform:translateX(120%)}}
.vsp img{width:118px;height:118px;border-radius:50%;object-fit:cover;border:4px solid #3d8bfd;box-shadow:0 0 30px #3d8bfd88}
.vsp.r img{border-color:#e5484d;box-shadow:0 0 30px #e5484d88}
.vsp b{display:block;color:#fff;font-size:16px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsp span{color:var(--muted);font-size:12px}
.vsx{font-family:var(--display);font-size:56px;color:#ffe28a;text-shadow:0 4px 0 #6b4a10,0 0 24px #e8b94a;animation:vsx .5s .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes vsx{from{transform:scale(3);opacity:0}}
.vsarena{position:relative;margin-top:28px;color:#d9c8ff;font-weight:800;letter-spacing:.15em;text-transform:uppercase;font-size:12px;text-align:center}
nav button{position:relative}
nav .dot{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--table)}
.sp-head{border-radius:16px;padding:16px;background:linear-gradient(135deg,#3b2d5e,#1d1630 60%,#4a3410);border:1px solid var(--gold-dim)}
.sp-head strong{display:block;font-family:var(--display);font-size:26px;color:var(--gold);line-height:1.1}
.sp-lv{display:flex;align-items:center;gap:10px;margin-top:10px}
.sp-lv b{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--gold);color:var(--table);font-size:20px}
.sp-lv .prog{flex:1;height:10px}
.premium-btn{width:100%;margin-top:12px;background:linear-gradient(135deg,#c77dff,#ffd56b);color:#120e1c}
.quests{display:grid;gap:8px}
.quest{display:flex;align-items:center;gap:10px;background:var(--table-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.quest .tx{flex:1;min-width:0}
.quest .tx b{display:block;font-size:14px}
.quest .prog{height:6px;margin-top:5px}
.quest button{padding:7px 10px;font-size:12px;white-space:nowrap}
.quest.done{opacity:.55}
.track{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:stretch}
.track .hd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.track .hd.pr{color:var(--gold)}
.tier{display:grid;place-items:center;font-weight:800;border-radius:10px;background:var(--table-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tier.on{background:var(--gold);color:var(--table);border-color:var(--gold)}
.rw{display:flex;align-items:center;gap:8px;background:var(--table-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0;min-height:44px}
.rw.prem{background:linear-gradient(135deg,#2a1d40,#3a2a12);border-color:#6b5320}
.rw .ri{font-size:20px;flex:none;width:26px;text-align:center}
.rw .ri img{width:26px;height:26px;object-fit:contain;vertical-align:middle}
.rw span{flex:1;min-width:0;font-size:14px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.15}
.rw button{padding:5px 7px;font-size:11px;border-radius:7px}
.rw.lock{opacity:.45}
.rw.got{opacity:.5}
.card.evo1{box-shadow:0 0 0 2px #5fb8ff,0 0 12px #5fb8ff99}
.card.evo2{box-shadow:0 0 0 2px #c77dff,0 0 16px #c77dffaa}
.card.evo3{box-shadow:0 0 0 2px #ffd56b,0 0 20px #ffd56bcc;animation:divin 2.4s ease-in-out infinite}
@keyframes divin{50%{box-shadow:0 0 0 2px #fff3c4,0 0 30px #ffd56b}}
.evob{position:absolute;right:4px;bottom:24px;z-index:1;font-size:9px;font-weight:800;padding:1px 4px;border-radius:5px;color:#120e1c;letter-spacing:.02em}
.evosteps{display:grid;gap:8px;text-align:left;margin:12px 0}
.evostep{display:flex;gap:10px;align-items:center;background:var(--table);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.evostep.done{border-color:var(--gold-dim)}
.evostep.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.evostep i{font-style:normal;font-size:20px;width:26px;text-align:center}
.evostep div{flex:1;min-width:0}
.evostep small{display:block;color:var(--muted)}
.evobtn{background:linear-gradient(135deg,#c77dff,#ffd56b)!important;color:#120e1c}
.circ{width:44px;height:44px;border-radius:50%;border:3px solid currentColor;box-shadow:0 0 12px currentColor,inset 0 0 10px currentColor;display:block;margin:auto}
.ci{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;filter:drop-shadow(0 0 3px #b06cff88)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;min-height:0}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
nav button{background:transparent;color:var(--muted);padding:8px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--gold)}
h2{font-family:var(--display);font-weight:800;font-size:28px;margin:8px 0 4px;color:var(--gold);text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

/* Accueil */
.arena{margin-top:8px;border-radius:16px;padding:18px;text-align:center;background:linear-gradient(180deg,#3b2d5e,var(--table-2));border:1px solid var(--gold-dim)}
.arena strong{display:block;font-family:var(--display);font-size:30px;color:var(--gold);line-height:1.1}
.troph{margin:12px auto 4px;max-width:260px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.versus{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0}
.duelist{flex:1;min-width:0;text-align:center;background:var(--table-2);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.duelist .av{font-size:40px;height:84px;display:grid;place-items:center}
.duelist .av img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--red);box-shadow:0 0 18px #e5484d55}
.foeimg{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:2px solid var(--red)}
.duelist b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-family:var(--display);font-size:28px;color:var(--gold)}
.play{width:100%;font-size:22px;padding:16px;font-family:var(--display);box-shadow:0 6px 0 var(--gold-dim)}

/* personnages à débloquer : au niveau indiqué, ou tout de suite en Éclats */

const HEROES=['mage','golem','pretresse','samourai'];
/* arènes à choisir : gratuites au niveau indiqué, ou tout de suite en Éclats. hue = teinte provisoire tant que l'illustration n'existe pas */

 {id:'academie',n:'Académie des Arcanes',lv:1,gems:0,art:'arena',hue:0,txt:'L\'arène des débuts, au-dessus des nuages'},
 {id:'volcan',n:'Forge du Volcan',lv:3,gems:150,hue:-55,txt:'Coulées de lave et enclumes géantes'},

 {id:'abysses',n:'Temple des Abysses',lv:10,gems:400,hue:170,txt:'Ruines englouties et coraux lumineux'},
 {id:'celeste',n:'Cité Céleste',lv:12,gems:500,hue:200,txt:'Palais d\'or au-dessus des étoiles'},
];

const mapOf=id=>MAPS.find(m=>m.id===id)||MAPS[0];

const CI='<img class="ci" src="art/coin_flat.webp" alt="Invoks">';
/* Éveil : 3 évolutions par personnage */
const EVO=[{n:'Base'},{n:'Éveillé',lv:3,gold:500,inv:80,c:'#5fb8ff',ic:'✦'},{n:'Ascendant',lv:6,gold:1500,inv:200,c:'#c77dff',ic:'✦✦'},{n:'Divin',lv:9,gold:4000,inv:400,c:'#ffd56b',ic:'✦✦✦'}];

const evoOf=id=>(S&&S.cards[id]&&S.cards[id].evo)||0;
/* effets d'invocation (cosmétiques) */
const CIRC={base:{n:'Classique',c:null,inv:0},flamme:{n:'Flammes infernales',c:'#ff7a1a',inv:60},givre:{n:'Givre éternel',c:'#9fe8ff',inv:60},ombre:{n:'Ombre du Néant',c:'#b46bff',inv:90},sakura:{n:'Pétales de sakura',c:'#ff8fd0',inv:90},or:{n:'Lumière divine',c:'#ffd56b',inv:150}};

const SEASON={n:'Saison 1 · L\'Éveil des Arcanes',tiers:30,per:100,premInv:400};
CIRC.aurore={n:'Aurore de saison',c:'#7dffd8',inv:0,season:1};
function passRw(i,prem){ // i = palier 1..30
  if(!prem){
    if(i%10===0)return{t:'chest',v:i===30?'legende':'magie'};
    if(i%5===0)return{t:'inv',v:20+i};
    if(i%3===0)return{t:'cards',v:4};
    return{t:'gold',v:60+i*10};
  }
  if(i===30)return{t:'inv',v:500};
  if(i===15)return{t:'circ',v:'aurore'};
  if(i%10===0)return{t:'chest',v:'legende'};
  if(i%4===0)return{t:'boost',v:'xpB'};
  if(i%2===0)return{t:'inv',v:30+i*2};
  return{t:'gold',v:150+i*20};
}

function giveRw(r){
  if(r.t==='gold')S.gold+=r.v;
  else if(r.t==='inv')S.gems+=r.v;
  else if(r.t==='cards'){const mine=IDS.filter(owned);for(let k=0;k<r.v;k++)S.cards[rnd(mine)].n+=2}
  else if(r.t==='chest'){openChest({...CHESTS.find(c=>c.id===r.v),free:1});return}
  else if(r.t==='circ'){S.circs[r.v]=1}
  else if(r.t==='boost'){S[r.v]+=3}
  persist();setTop();
}
/* quêtes du jour */
const QUESTS=[
 {id:'win',n:'Gagne 2 combats',goal:2,xp:80},{id:'play',n:'Joue 3 combats',goal:3,xp:50},

];
function dailyQuests(){
  const d=today();
  if(!S.quests||S.quests.day!==d){
    let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))>>>0;
    const pool=[...QUESTS],pick=[];
    while(pick.length<3){h=(h*1103515245+12345)>>>0;pick.push(pool.splice(h%pool.length,1)[0].id)}
    S.quests={day:d,list:pick.map(id=>({id,p:0,c:0}))};persist();
  }
  return S.quests.list;
}
const passLv=()=>Math.min(SEASON.tiers,Math.floor(S.pass.xp/SEASON.per));

function addXP(x){
  const ups=[];S.xp+=x;
  while(S.xp>=xpNeed(S.plv)){
    S.xp-=xpNeed(S.plv);S.plv++;
    const r={lv:S.plv,gems:15+S.plv*2,gold:100,cards:[],maps:[]};
    S.gems+=r.gems;S.gold+=r.gold;
    for(const [id,q] of Object.entries(NEWREQ))if(q.lv<=S.plv&&!owned(id)){S.cards[id]={lv:1,n:0};r.cards.push(id)}
    for(const m of MAPS)if(m.lv<=S.plv&&!S.maps[m.id]){S.maps[m.id]=1;r.maps.push(m.n)}
    ups.push(r);
  }
  return ups;
}

      for(const o of G.ents)if(o.team===e.team&&!o.tower&&o.hp>0&&o.hp<o.maxhp&&dist(o,e)<3){o.hp=Math.min(o.maxhp,o.hp+e.heal);for(let i=0;i<4;i++)part(o.x+(Math.random()-.5)*o.rad*2,o.y-Math.random()*o.rad,'#7ee2a0',{a:-Math.PI/2,sp:1.4,life:.6});G.fx.push({type:'num',x:o.x,y:o.y-o.rad,txt:'+'+Math.round(e.heal),t:0,dur:.6,c:'#7ee2a0'})}}

function aiPlay(i,x,y){
  const id=G.ahand[i],d=DEFS[id];
  G.aelx-=d.c;
  if(d.spell)cast('e',id,x,y,G.eLv);else spawn('e',id,clamp(x,...xb(4)),clamp(y,4,RV0-.3),G.eLv);
  G.aqueue.push(id);G.ahand[i]=G.anext;G.anext=G.aqueue.shift();
}
function ai(dt){
  if((G.ai-=dt)>0)return;
  G.ai=.7+Math.random()*.6;
  const can=G.ahand.map((id,i)=>({id,i,d:DEFS[id]})).filter(o=>o.d.c<=G.aelx);
  if(!can.length)return;
  const threats=G.ents.filter(e=>e.team==='p'&&!e.tower&&e.y<RV1+1.5&&e.deploy<=0);
  const sp=can.find(o=>o.d.spell);
  if(sp){
    for(const t of G.ents.filter(e=>e.team==='p'&&!e.tower)){
      const n=G.ents.filter(o=>o.team==='p'&&!o.tower&&dist(o,t)<2.3).length;
      if(n>=3&&t.y<26)return aiPlay(sp.i,t.x,t.y);
    }
    const weak=G.ents.find(e=>e.team==='p'&&e.tower&&e.hp<300);
    if(weak)return aiPlay(sp.i,weak.x,weak.y);
  }
  const troops=can.filter(o=>!o.d.spell);
  if(threats.length&&troops.length){
    const th=threats.sort((a,b)=>a.y-b.y)[0];
    const pick=th.fly?(troops.find(o=>o.d.air)||troops[0]):troops.sort((a,b)=>b.d.c-a.d.c)[0];
    return aiPlay(pick.i,th.x+(Math.random()-.5)*2,th.y-3);
  }
  if(troops.length&&(G.aelx>=9||(G.aelx>=6&&Math.random()<.35))){
    const pTow=G.ents.filter(e=>e.team==='p'&&e.tower&&e.kind==='princess').sort((a,b)=>a.hp-b.hp)[0];

    const o=rnd(troops);
    aiPlay(o.i,lx+(Math.random()-.5),o.d.bld?6:14);
  }
}

/* sens de regard de chaque illustration : 1 = vers la droite, -1 = vers la gauche */
const FACE={chevalier:-1,archere:1,gobelins:-1,squelettes:-1,mage:-1,golem:-1,dragon:1,loups:1,goule:1,pretresse:-1,samourai:1,phenix:1,chevdragon:1,necro:-1,roigob:1,samphenix:-1,sorciere:1,assassin:1,basilic:1,valkyrie:-1,chaman:1,lave:1,gardien:1};
function drawUnit(e,col,s){
  if(e.slowT>0){ctx.save();ctx.globalCompositeOperation='lighter';glow(e.x*s,(e.y-e.rad)*s,e.rad*2.2*s,'#5fd8ff');ctx.restore()}
  const fx=e.x*s,feet=(e.y+e.rad*.55)*s,lift=e.fly?(.9+Math.sin(e.walk*3)*.12)*s:0;
  const k=e.deploy>0?clamp(1-e.deploy,0,1):1,ease=1-Math.pow(1-k,3);
  const cc=e.team==='p'&&CIRC[S.circ]&&CIRC[S.circ].c?CIRC[S.circ].c:col;
  // cercle d'invocation au sol
  const cr=(e.rad*1.6+.4)*s*(.8+.38*(e.y/H));
  if(e.deploy>0){
    ctx.save();ctx.translate(fx,feet);ctx.scale(1,.42);
    ctx.strokeStyle=cc;ctx.lineWidth=3;ctx.globalAlpha=.9;
    ctx.beginPath();ctx.arc(0,0,cr*ease*1.3,0,7);ctx.stroke();
    ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,cr*ease*.9,0,7);ctx.stroke();
    for(let i=0;i<8;i++){const a=i*Math.PI/4+k*4;ctx.fillStyle='#fff';ctx.fillRect(Math.cos(a)*cr*1.1*ease-2,Math.sin(a)*cr*1.1*ease-2,4,4)}
    ctx.restore();
    const bw=cr*1.2,g=ctx.createLinearGradient(0,feet-6*s,0,feet);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,cc+'99');
    ctx.globalAlpha=1-k;ctx.fillStyle=g;ctx.fillRect(fx-bw/2,feet-6*s,bw,6*s);ctx.globalAlpha=1;
  }
  // ombre + socle d'équipe
  ctx.fillStyle='#00000066';ctx.beginPath();ctx.ellipse(fx,feet,cr*.75,cr*.3,0,0,7);ctx.fill();

  if(ULT[e.id]&&e.deploy<=0){const full=(e.pw||0)>=.8;ctx.save();ctx.translate(fx,feet);ctx.scale(1,.42);ctx.lineWidth=4;ctx.strokeStyle='#0008';ctx.beginPath();ctx.arc(0,0,cr*.95,0,7);ctx.stroke();
    ctx.strokeStyle=full?'#ffffff':'#ffd56b';if(full){ctx.shadowColor='#ffd56b';ctx.shadowBlur=10}ctx.beginPath();ctx.arc(0,0,cr*.95,-Math.PI/2,-Math.PI/2+(e.pw||0)*Math.PI*2);ctx.stroke();ctx.restore()}
  ctx.strokeStyle=e.fused?'#e8b94a':col;ctx.lineWidth=e.fused?3:2.5;ctx.beginPath();ctx.ellipse(fx,feet,cr*.75,cr*.3,0,0,7);ctx.stroke();
  if(e.evo){const ec=EVO[e.evo].c,pul=.55+.25*Math.sin(performance.now()/300+e.seed);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=pul;ctx.translate(fx,feet);ctx.scale(1,.42);glow(0,0,cr*(1+e.evo*.25),ec);
    if(e.evo>=3){ctx.strokeStyle=ec;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,cr*1.1,0,7);ctx.stroke()}ctx.restore();
    if(e.evo>=2&&e.deploy<=0&&Math.random()<.06*e.evo)part(e.x+(Math.random()-.5)*e.rad*2,e.y-Math.random()*e.rad*2,ec,{a:-Math.PI/2,sp:1+Math.random(),life:.7,size:.09})}
  const im=PIC[e.id];
  const dep=.8+.38*(e.y/H);
  const hgt=(2.1+e.rad*4)*s*(e.fused?1.15:1)*dep*(1+(e.evo||0)*.035);
  const top=feet-lift-hgt;
  if(im){
    const tt=performance.now()/1000+e.seed,moving=e.mv>0&&e.deploy<=0;
    const ph=e.walk*7;
    let rot=0,sx=1,sy=1,oy=0,ox=0;
    const br=Math.sin(tt*2.6)*.03;sy+=br;sx-=br*.5;                      // respiration
    if(e.fly){oy=Math.sin(tt*2.4)*.18*s;rot=Math.sin(tt*1.6)*.05}         // vol : flotte et tangue
    else if(moving){rot=Math.sin(ph)*.075;oy=-Math.abs(Math.sin(ph))*.22*s;sy*=1+Math.abs(Math.cos(ph))*.04} // marche : dandine et rebondit
    const dir=(FACE[e.id]||1)!==e.face?-1:1;
    if(e.atkT>0){const q=1-e.atkT/.18,l=Math.sin(q*Math.PI);rot+=l*.22;sx*=1+l*.14;sy*=1-l*.08;ox=l*.25*s} // élan d'attaque

    // contour lumineux de l'équipe (donne du volume et de la lisibilité)
    const ol=sil(e.id,e.evo>=3?'#ffd56b':col);if(ol){ctx.save();ctx.globalAlpha*=.75;ctx.drawImage(ol,-w*1.06/2,-h*1.025,w*1.06,h*1.035);ctx.restore()}

    const N=12,amp=(moving||e.fly?.05:.025)*w;
    const strips=(alpha)=>{for(let i=0;i<N;i++){const t0=i/N,wv=Math.sin(tt*3.4+i*.6)*amp*(1-t0)**1.4;
      ctx.drawImage(im,0,im.height*t0,im.width,im.height/N+1,-w/2+wv,-h+h*t0,w,h/N+1)}};
    strips();
    if(e.hitT>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=e.hitT/.12*.6;strips()}
    ctx.restore();
  }else{
    ctx.globalAlpha=Math.min(1,k*1.6);ctx.font=`${e.rad*1.8*s}px serif`;ctx.fillText(e.e,fx,feet-lift-e.rad*s);ctx.globalAlpha=1;
  }
  if(e.stunT>0){ctx.font=`${s*.6}px serif`;ctx.fillText('💫',fx+Math.sin(performance.now()/120)*s*.3,top-s*.2)}
  if(e.hp<e.maxhp||e.fused)bar(fx,(im?top+hgt*.08:feet-lift-e.rad*2.2*s),Math.max(e.rad*2*s,18),e.hp/e.maxhp,col);
}
function glow(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function bolt(x0,y0,x1,y1,seed){let r=seed;const rn=()=>((r=Math.sin(r*12.9898)*43758.5453)%1+1)%1;ctx.beginPath();ctx.moveTo(x0,y0);const n=9;for(let i=1;i<n;i++){const k=i/n;ctx.lineTo(x0+(x1-x0)*k+(rn()-.5)*40,y0+(y1-y0)*k)}ctx.lineTo(x1,y1);ctx.stroke()}

function openZones(){

function hint(t){$('#hint').textContent=t}
$('#hand').addEventListener('click',e=>{
  const c=e.target.closest('[data-i]');if(!c||!G||G.over)return;
  const i=+c.dataset.i;G.sel=G.sel===i?null:i;renderHand();
  if(G.sel!==null)hint(DEFS[G.hand[i]].spell?'Touchez n’importe où pour lancer le sort.':'Touchez la zone bleue pour invoquer.');
});
cv.addEventListener('pointerdown',e=>{
  if(!G||G.over||G.sel===null)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  const id=G.hand[G.sel],d=DEFS[id];
  if(d.c>G.elx)return hint(`Pas assez d’élixir (${d.c} nécessaires).`);
  if(!d.spell&&!openZones().some(z=>x>=z.x0&&x<=z.x1&&y>=z.y0))return hint('Invoquez dans la zone bleue, de votre côté.');
  G.elx-=d.c;
  if(d.spell){cast('p',id,x,y,S.cards[id].lv);G.st.spell++}else{spawn('p',id,x,y,S.cards[id].lv);G.st.summon++}
  G.queue.push(id);G.hand[G.sel]=G.next;G.next=G.queue.shift();G.sel=null;
  if(S.tut){S.tut=false;persist()}
  hint('');renderHand();
});
function loop(now){
  if(!G)return;
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if($('#ov').hidden&&!G.over){update(dt*(G.slowT>0?.3:1));G.slowT=Math.max(0,G.slowT-dt)}
  G.shake*=.86;if(G.banner&&(G.banner.t+=dt)>G.banner.dur)G.banner=null;
  draw();if(G.flash>0){ctx.fillStyle=`rgba(255,250,220,${G.flash*1.6})`;ctx.fillRect(0,0,W*SC,H*SC)}hud();
  if(G.over&&!G.ended){G.ended=true;setTimeout(endBattle,700)}
  raf=requestAnimationFrame(loop);
}
function endBattle(){
  const p=G.cr.p,e=G.cr.e,win=p>e,draw_=p===e;
  const dT=win?30:draw_?0:-20;
  const avBefore=AVATARS.filter(a=>a[3]()).length;
  S.tro=Math.max(0,S.tro+dT);S.best=Math.max(S.best,S.tro);S.played++;
  let gold=win?40+p*15:draw_?15:5;
  if(win)S.wins++;
  const loot=[];
  if(win){
    while(loot.length<4){const id=rnd(IDS.filter(owned)),n=DEFS[id].r==='L'?1:DEFS[id].r==='E'?1+(Math.random()<.5|0):2+Math.floor(Math.random()*3);S.cards[id].n+=n;loot.push([id,n])}
  }
  const xpMul=S.xpB>0?2:1;if(S.xpB>0)S.xpB--;
  if(win&&S.goldB>0){gold*=2;S.goldB--}
  const xpGain=(win?50+p*10:draw_?30:20)*xpMul;
  const spGain=win?40:draw_?25:15;S.pass.xp+=spGain;
  const qadd={win:win?1:0,play:1,summon:G.st.summon,towers:G.st.towers,spell:G.st.spell,fus:G.st.fus,crowns:p};
  for(const q of dailyQuests())q.p+=qadd[q.id]||0;
  const ups=addXP(xpGain);
  const newAv=AVATARS.filter(a=>a[3]()).length>avBefore;
  persist();
  const upHTML=ups.map(u=>`<div class="tile" style="margin-top:10px;border:1px solid var(--gold);border-radius:12px;padding:10px"><b style="color:var(--gold)">Niveau ${u.lv} !</b><div class="note">+${u.gems} ${CI} · +${u.gold} 🪙${u.cards.length?' · Nouveau personnage : '+u.cards.map(id=>DEFS[id].n).join(', '):''}${u.maps.length?' · Nouvelle arène : '+u.maps.join(', '):''}</div></div>`).join('');
  const title=win?'Victoire !':draw_?'Égalité':'Défaite';
  modal(`<h3>${title}</h3><div class="big">👑 ${p} – ${e}</div><div class="note">🏆 ${dT>=0?'+':''}${dT} trophées</div>
    ${win?`<div class="label" style="margin-top:12px">Coffre de victoire</div><div class="reveal">${loot.map(([id,n,nw],i)=>`<div class="w" style="animation-delay:${i*.2}s">${cardHTML(id,{lv:S.cards[id].lv})}<span class="tag" ${nw?'style="color:var(--ok)"':''}>${nw?'NOUVELLE !':'+'+n}</span></div>`).join('')}</div>`:''}
    <div class="big">+${gold} 🪙</div><div class="note">+${spGain} points de saison 📖 · +${xpGain} XP${xpMul>1?' (parchemin ×2)':''}</div>${upHTML}${newAv?'<div class="note" style="color:var(--gold)">🎭 Nouvel avatar débloqué dans votre profil !</div>':''}
    <div class="btns">${win&&!NATIVE?`<button id="x2">📺 Doubler l'or : +${gold*2} 🪙</button>`:''}<button class="${win?'ghost':''}" id="take">${win?`Prendre ${gold} 🪙`:'Continuer'}</button></div>`,
    box=>{
      box.querySelector('#take').onclick=()=>{S.gold+=gold;finish()};
      const x=box.querySelector('#x2');if(x)x.onclick=()=>fakeAd(()=>{S.gold+=gold*2;finish()});
    });
}
function finish(){document.body.classList.remove('battle');foe=rnd(FOES);persist();closeModal();cancelAnimationFrame(raf);G=null;foe=rnd(FOES);go('home')}
function fakeAd(done){
  let t=3;
  const tick=()=>{
    modal(`<div class="label">Publicité simulée</div><div class="adbox">${t||'✓'}</div>
      <p class="note">Dans le vrai jeu, une vidéo récompensée de 15 à 30 s s'affiche ici (AdMob, AppLovin…).</p>
      ${t?'':'<div class="btns"><button id="adok">Récupérer</button></div>'}`,box=>{const b=box.querySelector('#adok');if(b)b.onclick=done});
    if(t-->0)setTimeout(tick,1000);
  };tick();
}

/* ---------- Fenêtres ---------- */
function modal(html,bind){const ov=$('#ov');ov.innerHTML=`<div class="box">${html}</div>`;ov.hidden=false;
  ov.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));bind&&bind(ov.querySelector('.box'))}
function closeModal(){$('#ov').hidden=true;$('#ov').innerHTML=''}

/* ---------- Démarrage ---------- */
function start(data){
  S=migrate((data&&data.S)||load());
  try{fsInit()}catch(e){}
  try{document.addEventListener('fullscreenchange',()=>setTimeout(()=>{try{resize()}catch(e){}},100))}catch(e){}
  try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
  go('home');
  try{boot()}catch(e){const b=document.getElementById('boot');if(b)b.remove();setTimeout(afterBoot,300)}
}
const hot=window.claude?.hot;
hot?.ready?hot.ready(start):start(hot?.data??{});
</script>
